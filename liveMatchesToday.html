        <h5 class="card-title">Filter Matches</h5>
        <div class="row g-3 align-items-center">
          <div class="col-md-4">
            <input type="text" id="teamFilter" class="form-control" placeholder="Write the team name">
          </div>
        
          <div class="col-md-4">
            <button id="applyFilter" class="btn btn-primary w-100"> Filter</button>

                <th>Away Team</th>
                <th>Date</th>
                <th>DateTime</th>

                <th>Place</th>

            </thead>
